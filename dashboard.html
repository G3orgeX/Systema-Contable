<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Contable</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar glass-panel">
        <div class="container">
            <a href="#" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                Nexus
            </a>
            <ul class="navbar-nav">
                <li><a href="#" class="nav-link active">Dashboard</a></li>
                <li><a href="#" class="nav-link">Reportes</a></li>
                <li><a href="#" class="nav-link">Configuración</a></li>
                <li><a href="#" id="logoutBtn" class="nav-link">Salir</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-content container fade-in">
        
        <div class="dashboard-header">
            <div>
                <h2>Resumen Financiero</h2>
                <p>Bienvenido de nuevo, Admin.</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('monto').focus()">
                + Nuevo Movimiento
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <span class="stat-title">Ingresos Totales</span>
                <span class="stat-value income" id="kpi-ingresos">$0.00</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-title">Egresos Totales</span>
                <span class="stat-value expense" id="kpi-egresos">$0.00</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-title">Balance Actual</span>
                <span class="stat-value" id="kpi-balance">$0.00</span>
            </div>
        </div>

        <!-- Split Layout: Form & Table -->
        <div class="main-grid">
            
            <!-- Register Form -->
            <div class="form-card glass-panel slide-up" style="animation-delay: 0.1s;">
                <h3 class="card-title">Registrar Movimiento</h3>
                <form id="movementForm">
                    <div class="form-group">
                        <label for="tipo">Tipo de Movimiento</label>
                        <select id="tipo" class="form-control" required>
                            <option value="ingreso">Ingreso</option>
                            <option value="egreso">Egreso</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="concepto">Concepto</label>
                        <input type="text" id="concepto" class="form-control" placeholder="Ej. Pago de servicios" required>
                    </div>

                    <div class="form-group">
                        <label for="monto">Monto ($)</label>
                        <input type="number" step="0.01" id="monto" class="form-control" placeholder="0.00" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Guardar Registro
                    </button>
                </form>
            </div>

            <!-- Recent Movements Table -->
            <div class="table-card glass-panel slide-up" style="animation-delay: 0.2s;">
                <h3 class="card-title">Últimos Movimientos</h3>
                <div class="table-responsive">
                    <table id="movementsTable">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Concepto</th>
                                <th>Tipo</th>
                                <th>Monto</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows will be added here via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
